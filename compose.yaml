services:
  frontend:
    build:
      context: ./frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    
    # ターミナルっぽい入出力環境
    tty: true
    # 標準入力を開いたままにする
    stdin_open: true
  backend:
    build:
      context: ./backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    # ターミナルっぽい入出力環境
    tty: true
    # 標準入力を開いたままにする
    stdin_open: true