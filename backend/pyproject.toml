[project]
name = "backend"
version = "0.1.0"
description = "Music separation backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "huggingface-hub>=0.34.0",
    "librosa>=0.11.0",
    "numpy>=2.2.0",
    "onnx>=1.18.0,<1.20.0",
    "onnxconverter-common>=1.16.0,<1.17.0",
    # 1.27 以降は CUDA 13 ビルド。ベースイメージの CUDA 12.6 / cuDNN 9 と合わせる。
    "onnxruntime-gpu>=1.23.0,<1.27.0",
    "soundfile>=0.13.0",
    "tqdm>=4.67.1",
]
